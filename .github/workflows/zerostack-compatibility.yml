name: ZeroStack compatibility

on:
  pull_request:
    paths:
      - '.github/scripts/patch-zerostack-acp.py'
      - '.github/scripts/zerostack-acp-smoke.py'
      - '.github/workflows/zerostack-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerostack-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: ZeroStack ACP / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            profile: default
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            profile: default
          - platform: windows-x64
            runner: windows-latest
            profile: default
          - platform: linux-x64
            runner: ubuntu-24.04
            profile: lean
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            profile: lean
          - platform: windows-x64
            runner: windows-latest
            profile: lean
          - platform: linux-x64
            runner: ubuntu-24.04
            profile: acp-only
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            profile: acp-only
          - platform: windows-x64
            runner: windows-latest
            profile: acp-only
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            profile: default
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            profile: lean
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            profile: acp-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: gi-dellav/zerostack
          ref: 16fadb3b8f29238a5716eaf937ecf9d41a42f946
          path: zerostack
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Deny unapproved ACP Ask operations in the pinned worker
        run: python .github/scripts/patch-zerostack-acp.py

      - name: Install mold for Linux x64
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold

      - name: Build default-feature ZeroStack ACP binary
        if: matrix.profile == 'default'
        working-directory: zerostack
        run: cargo build --locked --release --features acp

      - name: Build lean ZeroStack ACP + MCP binary
        if: matrix.profile == 'lean'
        working-directory: zerostack
        run: cargo build --locked --release --no-default-features --features acp,mcp,archmd

      - name: Build minimal ACP-only ZeroStack binary
        if: matrix.profile == 'acp-only'
        working-directory: zerostack
        run: cargo build --locked --release --no-default-features --features acp

      - name: Start ACP, create a session, and record resident memory
        env:
          ZERO_STACK_PROFILE: ${{ matrix.profile }}
        run: python .github/scripts/zerostack-acp-smoke.py
